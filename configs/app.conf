# Application-side linker configuration: link the application immediately after
# the Maker Bootloader.
#
#   FLASH_LOAD_OFFSET = ALONZO_BOOTLOADER_SIZE
#   FLASH_LOAD_SIZE   = FLASH_SIZE - ALONZO_BOOTLOADER_SIZE
#
# These mirror the bootloader's CONFIG_FLASH_LOAD_OFFSET=0 /
# CONFIG_FLASH_LOAD_SIZE=ALONZO_BOOTLOADER_SIZE (see bootloader/prj.conf) and
# must be kept in sync with CONFIG_ALONZO_BOOTLOADER_SIZE in the board Kconfig.
#
# Defaults below assume the default 128 KB bootloader (0x20000).

CONFIG_FLASH_LOAD_OFFSET=0x20000
CONFIG_FLASH_LOAD_SIZE=0x60000
